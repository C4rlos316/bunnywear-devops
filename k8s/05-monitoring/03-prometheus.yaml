apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring

data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager.monitoring.svc.cluster.local:9093

    rule_files:
      - "/etc/prometheus/rules/*.yml"

    scrape_configs:

    - job_name: 'prometheus'
      static_configs:
      - targets: ['localhost:9090']

    - job_name: 'node-exporter'
      static_configs:
      - targets:
        - '192.168.223.134:9100'
        - '192.168.223.135:9100'
        - '192.168.223.136:9100'

    - job_name: 'kube-state-metrics'
      static_configs:
      - targets:
        - 'kube-state-metrics.monitoring.svc.cluster.local:8080'

    # Metricas de la tienda BunnyWear (Django + django-prometheus)
    # Apunta al Service del backend, que reparte entre las replicas.
    - job_name: 'bunnywear-backend'
      metrics_path: /metrics
      static_configs:
      - targets:
        - 'django-backend.bunnywear.svc.cluster.local:8000'

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: monitoring

spec:
  replicas: 1

  selector:
    matchLabels:
      app: prometheus

  template:
    metadata:
      labels:
        app: prometheus

    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:v2.51.2

        ports:
        - containerPort: 9090

        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus

        - name: alert-rules
          mountPath: /etc/prometheus/rules

      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config

      - name: alert-rules
        configMap:
          name: bunnywear-alert-rules

---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring

spec:
  type: NodePort

  selector:
    app: prometheus

  ports:
  - port: 9090
    targetPort: 9090
    nodePort: 30090
