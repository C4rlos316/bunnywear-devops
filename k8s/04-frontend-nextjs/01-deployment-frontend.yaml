apiVersion: apps/v1
kind: Deployment
metadata:
  name: bunnywear-frontend
  namespace: bunnywear

spec:
  replicas: 1

  selector:
    matchLabels:
      app: bunnywear-frontend

  template:
    metadata:
      labels:
        app: bunnywear-frontend

    spec:
      containers:
      - name: frontend
        image: docker.io/c4rlos316/bunnywear-frontend:7c71acbca3e57a67f4f3fc43d76998214a302f3d
        imagePullPolicy: Always

        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://django-backend:8000"

        ports:
        - containerPort: 3000
