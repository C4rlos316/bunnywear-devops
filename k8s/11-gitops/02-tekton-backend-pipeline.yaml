apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: kaniko-build-push
  namespace: tekton-pipelines

spec:
  params:
    - name: IMAGE
    - name: TAG
      default: "latest"
    - name: CONTEXT
      default: "backend"
    - name: DOCKERFILE
      default: "backend/Dockerfile"

  workspaces:
    - name: source
    - name: dockerconfig

  steps:
    - name: build-and-push
      image: gcr.io/kaniko-project/executor:v1.18.0

      args:
        - --dockerfile=$(workspaces.source.path)/$(params.DOCKERFILE)
        - --context=dir://$(workspaces.source.path)/$(params.CONTEXT)
        - --destination=$(params.IMAGE):$(params.TAG)
        - --destination=$(params.IMAGE):latest
        - --cache=true

      env:
        - name: DOCKER_CONFIG
          value: /kaniko/.docker

      volumeMounts:
        - name: docker-config
          mountPath: /kaniko/.docker

  volumes:
    - name: docker-config
      secret:
        secretName: dockerhub-secret
        items:
          - key: .dockerconfigjson
            path: config.json

---
apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: bunnywear-backend-pipeline
  namespace: tekton-pipelines

spec:
  params:
    - name: REPO_URL
      default: "https://github.com/C4rlos316/bunnywear-devops.git"

    - name: REVISION
      default: "main"

    - name: IMAGE
      default: "docker.io/c4rlos316/bunnywear-backend"

    - name: TAG
      default: "latest"

  workspaces:
    - name: source
    - name: dockerconfig

  tasks:

    - name: git-clone
      taskSpec:
        workspaces:
          - name: output

        steps:
          - name: clone
            image: alpine/git:latest
            script: |
              #!/bin/sh
              cd /workspace/output
              rm -rf bunnywear-devops

              git clone https://$(cat /etc/git-secret/username):$(cat /etc/git-secret/password)@github.com/C4rlos316/bunnywear-devops.git

            volumeMounts:
              - name: git-secret
                mountPath: /etc/git-secret

        volumes:
          - name: git-secret
            secret:
              secretName: git-credentials

      workspaces:
        - name: output
          workspace: source

    - name: build-push
      taskRef:
        name: kaniko-build-push
        kind: Task

      runAfter:
        - git-clone

      params:
        - name: IMAGE
          value: $(params.IMAGE)

        - name: TAG
          value: $(params.TAG)

        - name: CONTEXT
          value: bunnywear-devops/backend

        - name: DOCKERFILE
          value: bunnywear-devops/backend/Dockerfile

      workspaces:
        - name: source
          workspace: source

        - name: dockerconfig
          workspace: dockerconfig
