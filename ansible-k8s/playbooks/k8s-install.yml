---
- name: Copiar /etc/hosts a los nuevos nodos
  hosts: k8s_cluster
  become: yes

  tasks:
    - name: Hacer backup del /etc/hosts actual
      copy:
        src: /etc/hosts
        dest: /etc/hosts.backup.{{ ansible_date_time.epoch }}
        remote_src: yes
        mode: '0644'
      tags: hosts

    - name: Copiar /etc/hosts desde el master a todos los nodos
      copy:
        src: /etc/hosts
        dest: /etc/hosts
        owner: root
        group: root
        mode: '0644'
        backup: yes
      tags: hosts

    - name: Verificar contenido de /etc/hosts
      command: cat /etc/hosts
      register: hosts_content
      changed_when: false
      tags: hosts

    - name: Mostrar /etc/hosts actualizado
      debug:
        msg: "{{ hosts_content.stdout_lines }}"
      tags: hosts

    - name: Validar resolución de nombres del cluster
      shell: |
        getent hosts k8s-master || echo "FALLO: k8s-master"
        getent hosts k8s-worker1 || echo "FALLO: k8s-worker1"
        getent hosts k8s-worker2 || echo "FALLO: k8s-worker2"
      register: dns_check
      changed_when: false
      failed_when: "'FALLO' in dns_check.stdout"
      tags: hosts

- name: Preparar todos los nodos para Kubernetes
  hosts: k8s_cluster
  become: yes

  tasks:
    - name: Deshabilitar SELinux
      selinux:
        state: disabled

    - name: Deshabilitar swap
      shell: |
        swapoff -a
        sed -i '/ swap / s/^\(.*\)$/#\1/g' /etc/fstab

    - name: Cargar módulos del kernel
      copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          overlay
          br_netfilter

    - name: Aplicar módulos
      shell: |
        modprobe overlay
        modprobe br_netfilter

    - name: Configurar parámetros sysctl
      copy:
        dest: /etc/sysctl.d/k8s.conf
        content: |
          net.bridge.bridge-nf-call-iptables = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward = 1

    - name: Aplicar configuración sysctl
      command: sysctl --system

    - name: Instalar dnf plugins core
      dnf:
        name: dnf-plugins-core
        state: present

    - name: Agregar repositorio Docker
      shell: |
        dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo

    - name: Instalar containerd
      dnf:
        name: containerd.io
        state: present

    - name: Crear directorio de containerd
      file:
        path: /etc/containerd
        state: directory

    - name: Configurar containerd
      shell: |
        containerd config default > /etc/containerd/config.toml
        sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml

    - name: Iniciar containerd
      systemd:
        name: containerd
        state: started
        enabled: yes

    - name: Agregar repositorio de Kubernetes
      copy:
        dest: /etc/yum.repos.d/kubernetes.repo
        content: |
          [kubernetes]
          name=Kubernetes
          baseurl=https://pkgs.k8s.io/core:/stable:/v1.28/rpm/
          enabled=1
          gpgcheck=1
          gpgkey=https://pkgs.k8s.io/core:/stable:/v1.28/rpm/repodata/repomd.xml.key
          exclude=kubelet kubeadm kubectl cri-tools kubernetes-cni

    - name: Instalar Kubernetes
      dnf:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        disable_excludes: kubernetes

    - name: Iniciar kubelet
      systemd:
        name: kubelet
        state: started
        enabled: yes

- name: Configurar firewall en todos los nodos
  hosts: k8s_cluster
  become: yes

  tasks:
    - name: Asegurar que firewalld está activo
      systemd:
        name: firewalld
        state: started
        enabled: yes

- name: Configurar firewall en Master
  hosts: k8s_master
  become: yes

  tasks:
    - name: Abrir puertos del Master
      firewalld:
        port: "{{ item }}"
        permanent: yes
        state: enabled
        immediate: yes
      loop:
        - 6443/tcp
        - 2379-2380/tcp
        - 10250/tcp
        - 10251/tcp
        - 10252/tcp
        - 10255/tcp
        - 8285/udp
        - 8472/udp

- name: Configurar firewall en Workers
  hosts: k8s_workers
  become: yes

  tasks:
    - name: Abrir puertos de Workers
      firewalld:
        port: "{{ item }}"
        permanent: yes
        state: enabled
        immediate: yes
      loop:
        - 10250/tcp
        - 30000-32767/tcp
        - 8285/udp
        - 8472/udp

- name: Inicializar Master Node
  hosts: k8s_master
  become: yes

  tasks:
    - name: Verificar si el cluster ya está inicializado
      stat:
        path: /etc/kubernetes/admin.conf
      register: k8s_initialized

    - name: Inicializar cluster
      shell: |
        kubeadm init --pod-network-cidr={{ pod_network_cidr }} \
        --apiserver-advertise-address={{ ansible_host }}
      register: kubeadm_init
      when: not k8s_initialized.stat.exists

    - name: Crear directorio .kube
      file:
        path: /root/.kube
        state: directory

    - name: Copiar kubeconfig
      copy:
        src: /etc/kubernetes/admin.conf
        dest: /root/.kube/config
        remote_src: yes

    - name: Esperar a que Kubernetes API esté disponible
      shell: |
        for i in {1..30}; do
          kubectl get nodes >/dev/null 2>&1 && exit 0
          echo "Esperando Kubernetes API..."
          sleep 5
        done
        exit 1
      changed_when: false

    - name: Aplicar Flannel CNI
      shell: |
        kubectl apply -f https://raw.githubusercontent.com/flannel-io/flannel/master/Documentation/kube-flannel.yml
      register: flannel_apply
      changed_when: "'created' in flannel_apply.stdout or 'configured' in flannel_apply.stdout"

    - name: Esperar a que namespace kube-flannel exista
      shell: |
        for i in {1..20}; do
          kubectl get ns kube-flannel >/dev/null 2>&1 && exit 0
          sleep 3
        done
        exit 1
      changed_when: false

    
    - name: Esperar a que Flannel esté Running
      shell: |
        for i in {1..60}; do
          READY=$(kubectl get pods -n kube-flannel --no-headers 2>/dev/null | grep Running | wc -l)

          echo "Intento $i - Pods Running: $READY"

          if [ "$READY" -ge 1 ]; then
            echo "Flannel listo"
            exit 0
          fi

          sleep 5
        done

        kubectl get pods -n kube-flannel
        exit 1
      register: flannel_ready
      changed_when: false

    - name: Generar token de join fresco
      shell: kubeadm token create --print-join-command
      register: join_command
      changed_when: true

    - name: Guardar join command como fact del master
      set_fact:
        k8s_join_command: "{{ join_command.stdout }}"

    - name: Mostrar comando de join
      debug:
        msg: "Comando de join: {{ join_command.stdout }}"

- name: Unir Workers al Cluster
  hosts: k8s_workers
  become: yes

  tasks:
    - name: Verificar si el nodo ya está en el cluster
      shell: kubectl get nodes | grep {{ inventory_hostname }} || echo "not_found"
      register: node_check
      delegate_to: "{{ groups['k8s_master'][0] }}"
      changed_when: false
      failed_when: false

    - name: Mostrar estado actual del nodo
      debug:
        msg: "Nodo {{ inventory_hostname }}: {{ 'Ya está en el cluster, se omite' if 'not_found' not in node_check.stdout else 'Será agregado al cluster' }}"

    - name: Reset kubeadm si el nodo ya intentó unirse antes
      command: kubeadm reset -f
      when: "'not_found' in node_check.stdout"

    - name: Limpiar configuración previa de CNI
      shell: |
        rm -rf /etc/cni/net.d/*
        rm -rf /var/lib/kubelet/*
      when: "'not_found' in node_check.stdout"

    - name: Reiniciar containerd y kubelet
      systemd:
        name: "{{ item }}"
        state: restarted
      loop:
        - containerd
        - kubelet
      when: "'not_found' in node_check.stdout"

    - name: Unir worker al cluster
      shell: "{{ hostvars[groups['k8s_master'][0]]['k8s_join_command'] }}"
      register: join_result
      when: "'not_found' in node_check.stdout"

    - name: Mostrar resultado del join
      debug:
        msg: "{{ join_result.stdout_lines }}"
      when:
        - "'not_found' in node_check.stdout"
        - join_result.stdout is defined

    - name: Esperar a que el nodo aparezca en el cluster
      shell: kubectl get nodes | grep {{ inventory_hostname }}
      register: node_verify
      delegate_to: "{{ groups['k8s_master'][0] }}"
      until: node_verify.rc == 0
      retries: 15
      delay: 6
      when: "'not_found' in node_check.stdout"

- name: Verificar estado final del cluster
  hosts: k8s_master
  become: yes

  tasks:
    - name: Esperar a que todos los nodos estén Ready
      shell: |
        for i in {1..30}; do
          NOT_READY=$(kubectl get nodes --no-headers 2>/dev/null | grep -c "NotReady" || echo 0)
          if [ "$NOT_READY" -eq 0 ]; then
            echo "Todos los nodos están Ready!"
            exit 0
          fi
          sleep 3
        done
      register: nodes_wait
      changed_when: false

    - name: Mostrar estado de nodos
      command: kubectl get nodes -o wide
      register: final_nodes
      changed_when: false

    - name: Listar nodos del cluster
      debug:
        msg: "{{ final_nodes.stdout_lines }}"

    - name: Verificar pods del sistema
      command: kubectl get pods -n kube-system -o wide
      register: system_pods
      changed_when: false

    - name: Listar pods del sistema
      debug:
        msg: "{{ system_pods.stdout_lines }}"
